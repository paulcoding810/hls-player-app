name: Build

on:
  push:
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Shared tests and the debug APK
        run: ./gradlew :shared:jvmTest :composeApp:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: hls-player-debug
          path: composeApp/build/outputs/apk/debug/*.apk

  ios:
    # Nothing ships on iOS yet, but the shared code and the UI must keep compiling for it.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Shared tests on the simulator and the app framework
        run: ./gradlew :shared:iosSimulatorArm64Test :composeApp:linkDebugFrameworkIosSimulatorArm64
